<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>Segment</title>

<style>

:root {
--bg: #0b0b0c;
--card: #17171a;
--card2: #1c1c20;
--accent: #0088ff;
--text: #ffffff;
--text2: #8e8e93;
}

body {
margin:0;
background:var(--bg);
font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
color:var(--text);
}

.header {
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
animation:fadeIn .5s ease;
}

.balance {
background:linear-gradient(135deg,#0088ff,#0055ff);
padding:8px 14px;
border-radius:20px;
font-weight:600;
}

.profile {
width:36px;
height:36px;
border-radius:50%;
background:#2a2a2e;
}

.banner {
margin:16px;
background:linear-gradient(135deg,#0088ff,#7a5cff);
padding:20px;
border-radius:16px;
font-size:20px;
font-weight:700;
animation:slideUp .5s ease;
}

.tabs {
display:flex;
gap:20px;
padding:0 16px;
margin-bottom:10px;
}

.tab {
color:var(--text2);
}

.tab.active {
color:white;
font-weight:600;
}

.search {
margin:16px;
background:var(--card);
padding:12px;
border-radius:12px;
color:var(--text2);
}

.grid {
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:16px;
}

.card {
background:var(--card);
border-radius:16px;
padding:16px;
transition:.2s;
animation:fadeIn .4s ease;
}

.card:hover {
transform:scale(1.03);
background:var(--card2);
}

.icon {
font-size:32px;
}

.name {
margin-top:8px;
}

.price {
color:var(--accent);
font-size:14px;
}

.bottom {
position:fixed;
bottom:0;
width:100%;
background:#111114;
display:flex;
justify-content:space-around;
padding:12px;
}

.navbtn {
color:var(--text2);
}

.navbtn.active {
color:var(--accent);
}

@keyframes fadeIn {
from {opacity:0}
to {opacity:1}
}

@keyframes slideUp {
from {
opacity:0;
transform:translateY(20px)
}
to {
opacity:1;
transform:translateY(0)
}
}

</style>
</head>

<body>

<div class="header">

<div class="balance">0 TON</div>

<div class="profile"></div>

</div>

<div class="banner">
Segment Market 🎁
</div>

<div class="tabs">

<div class="tab active">Store</div>
<div class="tab">My Gifts</div>
<div class="tab">Profile</div>

</div>

<div class="search">
Search gifts...
</div>

<div class="grid">

<div class="card" onclick="buy('Star')">
<div class="icon">⭐</div>
<div class="name">Star Gift</div>
<div class="price">0 TON</div>
</div>

<div class="card" onclick="buy('Diamond')">
<div class="icon">💎</div>
<div class="name">Diamond Gift</div>
<div class="price">0 TON</div>
</div>

<div class="card" onclick="buy('Crown')">
<div class="icon">👑</div>
<div class="name">Royal Crown</div>
<div class="price">0 TON</div>
</div>

<div class="card" onclick="buy('Rocket')">
<div class="icon">🚀</div>
<div class="name">Rocket Gift</div>
<div class="price">0 TON</div>
</div>

</div>

<div class="bottom">

<div class="navbtn active">Store</div>
<div class="navbtn">Gifts</div>
<div class="navbtn">Profile</div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

function buy(item){

tg.showAlert("Purchase: " + item);

}

</script>

</body>
</html>
