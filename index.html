<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Segment</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
  background:#0f0f0f;
  color:white;
}

.header{
  padding:20px;
  font-size:24px;
  font-weight:600;
}

.balance{
  background:#1c1c1c;
  margin:15px;
  padding:20px;
  border-radius:16px;
  font-size:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:15px;
}

.card{
  background:#1c1c1c;
  padding:20px;
  border-radius:16px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.05);
}

.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#1c1c1c;
}

.nav button{
  flex:1;
  padding:15px;
  background:none;
  border:none;
  color:white;
  font-size:16px;
}

.page{
  display:none;
  padding-bottom:80px;
}

.page.active{
  display:block;
}

</style>
</head>

<body>

<div id="home" class="page active">

<div class="header">
Segment 🎁
</div>

<div class="balance">
Balance: <span id="balance">Loading...</span>
</div>

<div class="grid">

<div class="card" onclick="buyGift(1)">
⭐ Star Gift<br>1 TON
</div>

<div class="card" onclick="buyGift(2)">
💎 Diamond Gift<br>3 TON
</div>

<div class="card" onclick="buyGift(3)">
👑 Crown<br>5 TON
</div>

<div class="card" onclick="buyGift(4)">
🚀 Rocket<br>2 TON
</div>

</div>

</div>


<div id="inventory" class="page">
<div class="header">Inventory</div>
<div style="padding:20px;">
<div id="inventoryList"></div>
</div>
</div>


<div id="profile" class="page">
<div class="header">Profile</div>
<div style="padding:20px;" id="username">
Loading...
</div>
</div>



<div class="nav">
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('inventory')">Inventory</button>
<button onclick="showPage('profile')">Profile</button>
</div>



<script>

const tg = window.Telegram.WebApp;
tg.expand();

const API = "https://segment-backend.onrender.com";


function showPage(id){

  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  if(id === "inventory"){
    loadInventory();
  }



async function login(){

  const user = tg.initDataUnsafe.user;

  document.getElementById("username").innerText =
    "@" + user.username;

  const res = await fetch(API + "/login",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      id:user.id,
      username:user.username
    })

  });

  const data = await res.json();

  document.getElementById("balance").innerText =
    data.balance + " TON";

}



async function buyGift(id){

  const user = tg.initDataUnsafe.user;

  const res = await fetch(API + "/buy",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      userId:user.id,
      giftId:id
    })

  });

  const data = await res.json();

  if(data.error){

    tg.showAlert(data.error);
    return;

  }

  document.getElementById("balance").innerText =
    data.balance + " TON";

  tg.showAlert("Gift purchased!");

}


login();

async function loadInventory(){

  const user = tg.initDataUnsafe.user;

  const res = await fetch(API + "/inventory/" + user.id);

  const gifts = await res.json();

  const container = document.getElementById("inventoryList");

  if(gifts.length === 0){

    container.innerHTML = "No gifts yet";

    return;
  }

  container.innerHTML = "";

  gifts.forEach(gift => {

    container.innerHTML += `
      <div class="card">
        🎁 ${gift.name}
      </div>
    `;

  });

}

</script>


</body>
</html>
