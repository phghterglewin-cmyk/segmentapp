<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segment</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

:root {
--bg: #0c0c0d;
--card: #1a1a1c;
--card-hover: #232326;
--accent: #0088ff;
--text: #ffffff;
--text-secondary: #8e8e93;
--border: #2c2c2e;
}

* {
box-sizing: border-box;
}

body {
margin: 0;
background: var(--bg);
color: var(--text);
font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
}

.container {
max-width: 500px;
margin: auto;
padding: 16px;
}

.header {
text-align: center;
margin-top: 20px;
margin-bottom: 30px;
}

.logo {
font-size: 28px;
font-weight: 700;
}

.subtitle {
color: var(--text-secondary);
font-size: 14px;
margin-top: 4px;
}

.balance-card {
background: linear-gradient(135deg, #0088ff, #0057ff);
border-radius: 16px;
padding: 20px;
margin-bottom: 20px;
}

.balance-label {
font-size: 13px;
opacity: 0.9;
}

.balance-value {
font-size: 24px;
font-weight: 600;
margin-top: 5px;
}

.section-title {
font-size: 18px;
font-weight: 600;
margin: 20px 0 10px;
}

.gifts {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
}

.gift-card {
background: var(--card);
border-radius: 14px;
padding: 16px;
cursor: pointer;
transition: 0.2s;
border: 1px solid var(--border);
}

.gift-card:hover {
background: var(--card-hover);
transform: translateY(-2px);
}

.gift-icon {
font-size: 28px;
}

.gift-name {
font-size: 15px;
font-weight: 500;
margin-top: 8px;
}

.gift-price {
color: var(--accent);
font-size: 14px;
margin-top: 4px;
}

.button {
background: var(--accent);
border: none;
width: 100%;
padding: 14px;
border-radius: 12px;
color: white;
font-size: 16px;
margin-top: 20px;
cursor: pointer;
}

.button:active {
opacity: 0.8;
}

.footer {
text-align: center;
color: var(--text-secondary);
font-size: 12px;
margin-top: 30px;
}

</style>

</head>
<body>

<div class="container">

<div class="header">
<div class="logo">Segment 🎁</div>
<div class="subtitle">Premium Telegram Gifting Platform</div>
</div>

<div class="balance-card">
<div class="balance-label">Balance</div>
<div class="balance-value">0 Gifts</div>
</div>

<div class="section-title">Featured Gifts</div>

<div class="gifts">

<div class="gift-card" onclick="sendGift('Rose')">
<div class="gift-icon">🌹</div>
<div class="gift-name">Premium Rose</div>
<div class="gift-price">Free</div>
</div>

<div class="gift-card" onclick="sendGift('Bear')">
<div class="gift-icon">🧸</div>
<div class="gift-name">Luxury Bear</div>
<div class="gift-price">Free</div>
</div>

<div class="gift-card" onclick="sendGift('Diamond')">
<div class="gift-icon">💎</div>
<div class="gift-name">Diamond Gift</div>
<div class="gift-price">Free</div>
</div>

<div class="gift-card" onclick="sendGift('Crown')">
<div class="gift-icon">👑</div>
<div class="gift-name">Royal Crown</div>
<div class="gift-price">Free</div>
</div>

</div>

<button class="button" onclick="openProfile()">
Open Profile
</button>

<div class="footer">
Segment © 2026
</div>

</div>

<script>

let tg = window.Telegram.WebApp;
tg.expand();

function sendGift(name) {

tg.showAlert("Gift selected: " + name);

}

function openProfile() {

tg.showAlert("Profile coming soon");

}

</script>

</body>
</html>
